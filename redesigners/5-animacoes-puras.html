<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Squirrel — 5 Animações Puras (Sem Texto)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@700;800;900&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #050505;
      color: #f4f4f5;
    }
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .mobile-frame {
      width: 100%;
      max-width: 420px;
      height: 820px;
      border-radius: 40px;
      border: 3px solid #27272a;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9), 0 0 0 1px #18181b;
      background-color: #09090b;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ===================================================
       1. INFINITY RINGS / PORTAL CÓSMICO
       =================================================== */
    @keyframes spinPortal {
      0% { transform: rotate(0deg) scale(0.8); opacity: 0.3; }
      50% { transform: rotate(180deg) scale(1.15); opacity: 0.9; }
      100% { transform: rotate(360deg) scale(0.8); opacity: 0.3; }
    }
    @keyframes counterSpin {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    .portal-ring-1 {
      animation: spinPortal 5s ease-in-out infinite;
    }
    .portal-ring-2 {
      animation: counterSpin 7s linear infinite;
    }
    .portal-ring-3 {
      animation: spinPortal 4s ease-in-out infinite 1s;
    }

    /* ===================================================
       2. FITAS DE LUZ LÍQUIDA (ORGANIC LIQUID WAVE)
       =================================================== */
    @keyframes waveMorph1 {
      0%, 100% { d: path("M 0 30 Q 75 10 150 30 T 300 30"); }
      50% { d: path("M 0 30 Q 75 50 150 30 T 300 30"); }
    }
    @keyframes waveMorph2 {
      0%, 100% { d: path("M 0 30 Q 75 45 150 20 T 300 30"); }
      50% { d: path("M 0 30 Q 75 15 150 40 T 300 30"); }
    }
    .wave-anim-1 {
      animation: waveMorph1 4s ease-in-out infinite;
    }
    .wave-anim-2 {
      animation: waveMorph2 3.2s ease-in-out infinite;
    }

    /* ===================================================
       3. PRISMA HEXAGONAL 3D GIRATÓRIO (CYBER PRISM)
       =================================================== */
    @keyframes prismRotate {
      0% { transform: rotateX(60deg) rotateZ(0deg); }
      100% { transform: rotateX(60deg) rotateZ(360deg); }
    }
    @keyframes floatPrism {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .prism-container {
      perspective: 800px;
      animation: floatPrism 3s ease-in-out infinite;
    }
    .prism-mesh {
      transform-style: preserve-3d;
      animation: prismRotate 8s linear infinite;
    }

    /* ===================================================
       4. CONSTELAÇÃO / REDE NEURAL FLUTUANTE
       =================================================== */
    @keyframes nodeFloat1 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(15px, -12px); }
    }
    @keyframes nodeFloat2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-12px, 14px); }
    }
    @keyframes nodeFloat3 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(10px, 15px); }
    }
    .node-1 { animation: nodeFloat1 4s ease-in-out infinite; }
    .node-2 { animation: nodeFloat2 5s ease-in-out infinite; }
    .node-3 { animation: nodeFloat3 3.5s ease-in-out infinite; }

    /* ===================================================
       5. ESQUILO NEON MINIMALISTA CORRENDO EM LOOP
       =================================================== */
    @keyframes runnerRun {
      0% { transform: translateX(-40px); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateX(280px); opacity: 0; }
    }
    @keyframes bobRun {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .runner-trail {
      animation: runnerRun 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .runner-bob {
      animation: bobRun 0.4s ease-in-out infinite;
    }
  </style>
</head>
<body class="p-3 md:p-8 max-w-5xl mx-auto pb-28">

  <!-- CABEÇALHO -->
  <div class="mb-6 text-center">
    <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 text-xs font-black uppercase tracking-widest mb-2 shadow-sm">
      ✨ 100% VISUAL • ZERO TEXTO
    </div>
    <h1 class="text-2xl md:text-3xl font-black uppercase tracking-tight text-white">
      5 Animações Puras para o Footer
    </h1>
    <p class="text-zinc-400 text-sm mt-1 max-w-xl mx-auto font-medium">
      Pura arte e movimento contínuo preenchendo o espaço inferior:
    </p>

    <!-- SELETOR DE 5 ANIMAÇÕES -->
    <div class="mt-4 grid grid-cols-2 sm:grid-cols-5 gap-2 bg-[#121216] p-1.5 rounded-2xl border border-zinc-800 max-w-3xl mx-auto">
      <button onclick="setAnim(1)" id="btn-a1" class="py-2.5 rounded-xl text-xs font-black bg-cyan-500 text-zinc-950 shadow transition-all">
        1. Portal Holográfico
      </button>
      <button onclick="setAnim(2)" id="btn-a2" class="py-2.5 rounded-xl text-xs font-bold text-zinc-400 hover:text-white transition-all">
        2. Fitas de Seda Líquida
      </button>
      <button onclick="setAnim(3)" id="btn-a3" class="py-2.5 rounded-xl text-xs font-bold text-zinc-400 hover:text-white transition-all">
        3. Prisma 3D Hexagonal
      </button>
      <button onclick="setAnim(4)" id="btn-a4" class="py-2.5 rounded-xl text-xs font-bold text-zinc-400 hover:text-white transition-all">
        4. Constelação Neural
      </button>
      <button onclick="setAnim(5)" id="btn-a5" class="py-2.5 rounded-xl text-xs font-bold text-zinc-400 hover:text-white transition-all">
        5. Corrida Néon Loop
      </button>
    </div>
  </div>

  <!-- CONTAINER DO CELULAR -->
  <div class="flex flex-col items-center justify-center">

    <div class="mobile-frame">
      
      <!-- CABEÇALHO DO APP -->
      <div class="border-b border-zinc-900 bg-[#09090b] px-4 py-3 flex items-center justify-between flex-shrink-0">
        <div class="flex items-center gap-2">
          <span class="text-base font-black uppercase tracking-tighter text-white">CAIXA</span>
          <span class="h-2 w-2 rounded-full bg-emerald-400"></span>
          <span class="text-[11px] font-black text-zinc-400 uppercase">27 AGO</span>
        </div>
        <div id="anim-tag" class="text-xs font-black text-cyan-400 uppercase bg-cyan-500/10 px-2.5 py-0.5 rounded-xl border border-cyan-500/20">
          Opção 1: Portal Holográfico
        </div>
      </div>

      <!-- CORPO SCROLLÁVEL SIMULADO -->
      <div class="flex-1 overflow-y-auto p-3.5 space-y-3 relative">
        
        <!-- CARD DO TOTAL (CONTEXTO) -->
        <div class="bg-[#121216] border border-zinc-800/80 rounded-2xl p-3 px-3.5 shadow-lg flex items-center justify-between opacity-40">
          <div>
            <div class="text-[10px] font-bold text-zinc-400 uppercase">Total do Caixa</div>
            <div class="mono text-lg font-black text-white">R$ 7.340,98</div>
          </div>
          <span class="text-[10px] font-bold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-lg">
            22 baixas
          </span>
        </div>

        <!-- OUTROS RECEBIMENTOS (CONTEXTO) -->
        <div class="grid grid-cols-2 gap-2.5 opacity-40">
          <div class="bg-[#121216] border border-blue-500/30 rounded-2xl p-3 min-h-[70px]">
            <div class="text-[10px] font-bold text-blue-400 uppercase">POS Cartões</div>
            <div class="mono text-base font-black text-white">R$ 1.840,50</div>
          </div>
          <div class="bg-[#121216] border border-purple-500/30 rounded-2xl p-3 min-h-[70px]">
            <div class="text-[10px] font-bold text-purple-400 uppercase">Convênios</div>
            <div class="mono text-base font-black text-white">R$ 650,00</div>
          </div>
        </div>

        <!-- DIVISOR SUTIL ANTES DO FOOTER -->
        <div class="pt-6 pb-2 text-center">
          <div class="h-px bg-gradient-to-r from-transparent via-zinc-800 to-transparent w-2/3 mx-auto"></div>
        </div>

        <!-- ==============================================
             ÁREA DE ANIMAÇÃO PURA (100% VISUAL / ZERO TEXTO)
             ============================================== -->
        <div id="anim-container" class="min-h-[160px] flex items-center justify-center relative overflow-hidden">
          <!-- Injetado via JS -->
        </div>

      </div>

      <!-- BARRA FLUTUANTE INFERIOR (BOTTOM BAR) -->
      <div class="p-3 bg-[#09090b]/90 backdrop-blur-md border-t border-zinc-900 flex-shrink-0">
        <div class="bg-[#121216] border border-zinc-800 rounded-2xl p-2 px-4 flex items-center justify-between shadow-2xl">
          <div class="flex items-center gap-2 text-emerald-400 text-xs font-black uppercase tracking-wider">
            <span class="h-2 w-2 rounded-full bg-emerald-400"></span>
            <span>Caixa 2701</span>
          </div>
          <div class="h-8 px-4 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-300 text-xs font-bold flex items-center">
            Menu
          </div>
        </div>
      </div>

    </div>

    <!-- DESCRIÇÃO DA ANIMAÇÃO -->
    <div id="anim-description" class="mt-6 max-w-xl text-center bg-[#121216] p-4 rounded-2xl border border-zinc-800 text-xs text-zinc-300">
      <!-- Injetado via JS -->
    </div>

  </div>

  <script>
    let currentAnim = 1;

    function setAnim(n) {
      currentAnim = n;

      for (let i = 1; i <= 5; i++) {
        const btn = document.getElementById('btn-a' + i);
        if (i === n) {
          btn.className = 'py-2.5 rounded-xl text-xs font-black bg-cyan-500 text-zinc-950 shadow transition-all';
        } else {
          btn.className = 'py-2.5 rounded-xl text-xs font-bold text-zinc-400 hover:text-white transition-all';
        }
      }

      render();
    }

    function render() {
      const container = document.getElementById('anim-container');
      const tag = document.getElementById('anim-tag');
      const desc = document.getElementById('anim-description');

      if (currentAnim === 1) {
        // ==========================================
        // OPÇÃO 1: PORTAL HOLOGRÁFICO (INFINITY RINGS)
        // ==========================================
        tag.innerText = '1. Portal Holográfico';
        tag.className = 'text-xs font-black text-cyan-400 uppercase bg-cyan-500/10 px-2.5 py-0.5 rounded-xl border border-cyan-500/20';
        desc.innerHTML = `<b>Opção 1 — Portal Holográfico:</b> Anéis concêntricos que giram em sentidos opostos com brilho ciano e esmeralda. Hipnótico, futurista e 100% visual.`;

        container.innerHTML = `
          <div class="relative w-28 h-28 flex items-center justify-center">
            <!-- Anel Externo -->
            <div class="absolute inset-0 rounded-full border-2 border-dashed border-cyan-500/40 portal-ring-1 shadow-[0_0_20px_rgba(6,182,212,0.3)]"></div>
            <!-- Anel Médio -->
            <div class="absolute inset-3 rounded-full border-2 border-emerald-400/40 border-dotted portal-ring-2 shadow-[0_0_15px_rgba(52,211,153,0.3)]"></div>
            <!-- Anel Interno -->
            <div class="absolute inset-6 rounded-full border border-indigo-400/50 portal-ring-3"></div>
            <!-- Núcleo Luminoso -->
            <div class="w-4 h-4 rounded-full bg-gradient-to-tr from-cyan-400 to-emerald-400 shadow-[0_0_15px_#22d3ee] animate-pulse"></div>
          </div>
        `;
      } else if (currentAnim === 2) {
        // ==========================================
        // OPÇÃO 2: FITAS DE SEDA LÍQUIDA (ORGANIC WAVES)
        // ==========================================
        tag.innerText = '2. Fitas de Seda Líquida';
        tag.className = 'text-xs font-black text-emerald-400 uppercase bg-emerald-500/10 px-2.5 py-0.5 rounded-xl border border-emerald-500/20';
        desc.innerHTML = `<b>Opção 2 — Fitas de Seda Líquida:</b> Duas ondas orgânicas luminosas que se cruzam e ondulam suavemente como fitas de aurora boreal.`;

        container.innerHTML = `
          <div class="w-full max-w-[280px] h-24 flex items-center justify-center relative">
            <svg viewBox="0 0 300 60" class="w-full h-full">
              <!-- Onda 1: Esmeralda -->
              <path class="wave-anim-1" d="M 0 30 Q 75 10 150 30 T 300 30" 
                    fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"
                    filter="drop-shadow(0 0 8px #10b981)" opacity="0.8" />
              <!-- Onda 2: Ciano / Índigo -->
              <path class="wave-anim-2" d="M 0 30 Q 75 45 150 20 T 300 30" 
                    fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round"
                    filter="drop-shadow(0 0 8px #6366f1)" opacity="0.7" />
            </svg>
          </div>
        `;
      } else if (currentAnim === 3) {
        // ==========================================
        // OPÇÃO 3: PRISMA 3D HEXAGONAL
        // ==========================================
        tag.innerText = '3. Prisma 3D Hexagonal';
        tag.className = 'text-xs font-black text-purple-400 uppercase bg-purple-500/10 px-2.5 py-0.5 rounded-xl border border-purple-500/20';
        desc.innerHTML = `<b>Opção 3 — Prisma 3D Hexagonal:</b> Geometria tridimensional translúcida com reflexo neon girando em perspectiva isométrica.`;

        container.innerHTML = `
          <div class="prism-container flex items-center justify-center">
            <div class="prism-mesh relative w-20 h-20 flex items-center justify-center">
              <div class="absolute inset-0 rounded-2xl border-2 border-purple-500/60 shadow-[0_0_20px_rgba(168,85,247,0.4)]"></div>
              <div class="absolute inset-2 rounded-xl border border-dashed border-cyan-400/60 rotate-45 shadow-[0_0_15px_rgba(34,211,238,0.4)]"></div>
              <div class="w-3 h-3 rounded-full bg-white shadow-[0_0_12px_#ffffff]"></div>
            </div>
          </div>
        `;
      } else if (currentAnim === 4) {
        // ==========================================
        // OPÇÃO 4: CONSTELAÇÃO NEURAL FLUTUANTE
        // ==========================================
        tag.innerText = '4. Constelação Neural';
        tag.className = 'text-xs font-black text-amber-400 uppercase bg-amber-500/10 px-2.5 py-0.5 rounded-xl border border-amber-500/20';
        desc.innerHTML = `<b>Opção 4 — Constelação Neural:</b> Partículas luminosas interconectadas por feixes de luz que flutuam organicamente no espaço escuro.`;

        container.innerHTML = `
          <div class="relative w-48 h-24 flex items-center justify-center">
            <!-- Ponto 1 -->
            <div class="absolute left-6 top-4 w-3 h-3 rounded-full bg-amber-400 shadow-[0_0_12px_#fcd34d] node-1"></div>
            <!-- Ponto 2 -->
            <div class="absolute right-8 top-8 w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-[0_0_10px_#34d399] node-2"></div>
            <!-- Ponto 3 -->
            <div class="absolute left-20 bottom-3 w-3 h-3 rounded-full bg-cyan-400 shadow-[0_0_12px_#22d3ee] node-3"></div>
            <!-- Feixes de Conexão -->
            <svg class="absolute inset-0 w-full h-full pointer-events-none opacity-40">
              <line x1="40" y1="20" x2="160" y2="40" stroke="#fcd34d" stroke-dasharray="4" stroke-width="1.5" />
              <line x1="160" y1="40" x2="90" y2="70" stroke="#34d399" stroke-dasharray="4" stroke-width="1.5" />
              <line x1="90" y1="70" x2="40" y2="20" stroke="#22d3ee" stroke-dasharray="4" stroke-width="1.5" />
            </svg>
          </div>
        `;
      } else if (currentAnim === 5) {
        // ==========================================
        // OPÇÃO 5: CORRIDA NÉON EM LOOP (CYBER SQUIRREL TRAIL)
        // ==========================================
        tag.innerText = '5. Corrida Néon em Loop';
        tag.className = 'text-xs font-black text-amber-400 uppercase bg-amber-500/10 px-2.5 py-0.5 rounded-xl border border-amber-500/20';
        desc.innerHTML = `<b>Opção 5 — Corrida Néon em Loop:</b> Uma faísca de luz dourada com rastro de cometa que corre em loop horizontal fluido saltitando como um esquilo veloz.`;

        container.innerHTML = `
          <div class="w-full max-w-[280px] h-16 relative flex items-center overflow-hidden">
            <!-- Linha Guia Sutil -->
            <div class="w-full h-0.5 bg-gradient-to-r from-transparent via-zinc-800 to-transparent"></div>
            
            <!-- Faísca Saltitante com Rastro -->
            <div class="absolute left-0 runner-trail flex items-center">
              <div class="runner-bob flex items-center">
                <!-- Rastro de Luz -->
                <div class="w-14 h-1.5 bg-gradient-to-l from-amber-400 via-amber-500/40 to-transparent rounded-full mr-[-2px] blur-[1px]"></div>
                <!-- Cabeça Luminosa -->
                <div class="w-3.5 h-3.5 rounded-full bg-amber-300 shadow-[0_0_14px_#fcd34d] border border-white"></div>
              </div>
            </div>
          </div>
        `;
      }
    }

    render();
  </script>
</body>
</html>
