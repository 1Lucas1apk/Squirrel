<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Squirrel — 3 Conceitos de Elite: Dinheiro / Transações</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@700;800;900&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #050505;
      color: #f4f4f5;
    }
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .mobile-frame {
      width: 100%;
      max-width: 420px;
      height: 870px;
      border-radius: 40px;
      border: 3px solid #27272a;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9), 0 0 0 1px #18181b;
      background-color: #09090b;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .pixelated {
      image-rendering: pixelated;
    }
  </style>
</head>
<body class="p-3 md:p-8 max-w-6xl mx-auto pb-28">

  <!-- CABEÇALHO DA APRESENTAÇÃO -->
  <div class="mb-6 text-center">
    <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 text-xs font-black uppercase tracking-widest mb-2 shadow-sm">
      💎 ETAPA 3 • 3 CONCEITOS DE ALTO LUXO
    </div>
    <h1 class="text-2xl md:text-3xl font-black uppercase tracking-tight text-white">
      Dinheiro & Transações de Elite
    </h1>
    <p class="text-zinc-400 text-sm mt-1 max-w-2xl mx-auto font-medium">
      Projetados com o mesmo padrão visual, proporções áureas de 36px e fluidez do Painel Principal:
    </p>

    <!-- SELETOR DOS 3 CONCEITOS -->
    <div class="mt-4 grid grid-cols-1 sm:grid-cols-3 gap-2 bg-[#121216] p-1.5 rounded-2xl border border-zinc-800 max-w-3xl mx-auto">
      <button onclick="setEliteConcept(1)" id="btn-c1" class="py-2.5 rounded-xl text-xs font-black bg-emerald-500 text-zinc-950 shadow transition-all">
        1. Terminal Vault & Quick-Tags
      </button>
      <button onclick="setEliteConcept(2)" id="btn-c2" class="py-2.5 rounded-xl text-xs font-bold text-zinc-400 hover:text-white transition-all">
        2. Cyber-Fintech Studio
      </button>
      <button onclick="setEliteConcept(3)" id="btn-c3" class="py-2.5 rounded-xl text-xs font-bold text-zinc-400 hover:text-white transition-all">
        3. Timeline Audit & Bottom-Sheet
      </button>
    </div>
  </div>

  <!-- CONTAINER DO CELULAR -->
  <div class="flex flex-col items-center justify-center">

    <div class="mobile-frame">
      
      <!-- CABEÇALHO DO APP -->
      <div class="border-b border-zinc-900 bg-[#09090b] px-4 py-3 flex items-center justify-between flex-shrink-0">
        <div class="flex items-center gap-2">
          <span class="text-base font-black uppercase tracking-tighter text-white">DINHEIRO</span>
          <span class="h-2 w-2 rounded-full bg-emerald-400"></span>
          <span class="text-[11px] font-black text-zinc-400 uppercase">27 AGO</span>
        </div>
        <div id="concept-tag" class="px-2.5 py-1 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-black uppercase">
          Conceito 1: Terminal Vault
        </div>
      </div>

      <!-- CORPO DINÂMICO DA TELA -->
      <div id="screen-body" class="flex-1 overflow-y-auto p-3.5 space-y-3 relative pb-36">
        <!-- Injetado via JS -->
      </div>

      <!-- BARRA FLUTUANTE OFICIAL (DINHEIRO ATIVO) -->
      <div class="absolute bottom-6 left-0 right-0 px-3 z-50 flex items-center justify-center pointer-events-auto">
        <div class="bg-[#141418]/95 backdrop-blur-2xl border border-zinc-700/80 rounded-full p-1.5 px-2 flex items-center gap-1 shadow-[0_20px_50px_rgba(0,0,0,0.95)]">
          <button class="h-10 w-10 rounded-full flex items-center justify-center text-zinc-400"><i data-lucide="layout-dashboard" class="w-4 h-4"></i></button>
          <button class="flex items-center gap-2 py-2 px-4 rounded-full bg-white text-zinc-950 shadow-md font-black">
            <i data-lucide="banknote" class="w-4 h-4 stroke-[2.5]"></i>
            <span class="text-[10.5px] uppercase tracking-tight font-sans">Dinheiro</span>
          </button>
          <button class="h-10 w-10 rounded-full flex items-center justify-center text-zinc-400"><i data-lucide="credit-card" class="w-4 h-4"></i></button>
          <button class="h-10 w-10 rounded-full flex items-center justify-center text-zinc-400"><i data-lucide="building-2" class="w-4 h-4"></i></button>
          <button class="h-10 w-10 rounded-full flex items-center justify-center text-zinc-400 relative">
            <i data-lucide="check-square" class="w-4 h-4"></i>
            <span class="absolute -top-1 -right-1 px-1.5 py-0.2 rounded-full bg-blue-500 text-[8.5px] font-black text-white shadow-sm">22</span>
          </button>
        </div>
      </div>

    </div>

    <!-- DESCRIÇÃO DETALHADA DO CONCEITO -->
    <div id="concept-description" class="mt-6 max-w-xl text-left bg-[#121216] p-5 rounded-2xl border border-zinc-800 text-xs text-zinc-300 space-y-2">
      <!-- Injetado via JS -->
    </div>

  </div>

  <script>
    let currentConcept = 1;
    let selectedNatureza = 'entrada';
    let selectedCat = 'dinheiro';
    let currentValor = '0,00';
    let isCalcOpen = false;

    function setEliteConcept(n) {
      currentConcept = n;

      for (let i = 1; i <= 3; i++) {
        const btn = document.getElementById('btn-c' + i);
        if (i === n) {
          btn.className = 'py-2.5 rounded-xl text-xs font-black bg-emerald-500 text-zinc-950 shadow transition-all';
        } else {
          btn.className = 'py-2.5 rounded-xl text-xs font-bold text-zinc-400 hover:text-white transition-all';
        }
      }

      render();
    }

    function addValor(v) {
      let num = parseFloat(currentValor.replace('.', '').replace(',', '.')) || 0;
      num += v;
      currentValor = num.toFixed(2).replace('.', ',');
      render();
    }

    function setNatureza(nat) {
      selectedNatureza = nat;
      render();
    }

    function setCat(cat) {
      selectedCat = cat;
      render();
    }

    function toggleCalc() {
      isCalcOpen = !isCalcOpen;
      render();
    }

    function render() {
      const body = document.getElementById('screen-body');
      const tag = document.getElementById('concept-tag');
      const desc = document.getElementById('concept-description');

      if (currentConcept === 1) {
        // =========================================================================
        // CONCEITO 1: TERMINAL VAULT & QUICK-TAGS (O MAIS ÁGIL & ERGONÔMICO)
        // =========================================================================
        tag.innerText = 'Conceito 1: Terminal Vault';
        tag.className = 'px-2.5 py-1 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-black uppercase';
        
        desc.innerHTML = `
          <div class="font-black text-white uppercase text-sm mb-1">👑 Conceito 1 — Terminal Vault & Quick-Tags:</div>
          <div><b>• Card Hero do Dinheiro:</b> Mostra o saldo em espécie na gaveta (<code>R$ 1.051,00</code>) com mini-termômetro de entradas vs sangrias.</div>
          <div><b>• Botões Rápidos de Incremento (+5, +10, +20, +50):</b> O operador pode somar valores de troco e notas em 1 toque sem precisar digitar no teclado virtual!</div>
          <div><b>• Categorias em Pílulas Lapidadas:</b> Seleção rápida entre Dinheiro, Prestação, Misto e À Vista.</div>
          <div><b>• Feed de Transações com Linha de Status:</b> Cada card possui borda lateral luminosa (verde para entrada, vermelho para sangria), hora exata, contrato e divisão perfeita de reais e centavos.</div>
        `;

        body.innerHTML = `
          <!-- 1. HERO DO DINHEIRO NA GAVETA -->
          <div class="bg-[#121216] border border-zinc-800/80 rounded-[28px] p-4 shadow-xl">
            <div class="flex items-center justify-between text-xs font-black uppercase text-zinc-400 mb-1">
              <span>Dinheiro Físico em Gaveta</span>
              <span class="text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20">22 Entradas</span>
            </div>
            <div class="mono text-[32px] font-black text-emerald-400 leading-tight">
              <span class="text-zinc-500 text-base font-bold">R$</span> 1.051<span class="text-emerald-300 text-xl font-extrabold">,00</span>
            </div>
            <div class="flex items-center justify-between text-[10px] text-zinc-400 font-bold mt-2 pt-2 border-t border-zinc-800/60">
              <div class="flex items-center gap-1.5">
                <span class="h-2 w-2 rounded-full bg-emerald-400"></span>
                <span>Entradas: <b class="text-white">+R$ 1.051,00</b></span>
              </div>
              <div class="flex items-center gap-1.5">
                <span class="h-2 w-2 rounded-full bg-red-400"></span>
                <span>Sangrias: <b class="text-white">-R$ 0,00</b></span>
              </div>
            </div>
          </div>

          <!-- 2. ESTAÇÃO DE LANÇAMENTO COMPACTA & ÁGIL -->
          <div class="bg-[#121216] border border-zinc-800/80 rounded-[26px] p-3.5 shadow-xl space-y-3">
            
            <!-- Switcher: Entrada vs Sangria -->
            <div class="grid grid-cols-2 gap-1.5 bg-[#09090c] p-1 rounded-2xl border border-zinc-800">
              <button onclick="setNatureza('entrada')" class="py-2 rounded-xl text-xs font-black uppercase flex items-center justify-center gap-1.5 transition-all ${selectedNatureza === 'entrada' ? 'bg-emerald-500 text-zinc-950 shadow-md' : 'text-zinc-400 hover:text-white'}">
                <i data-lucide="arrow-down-left" class="w-3.5 h-3.5 stroke-[2.5]"></i>
                <span>+ Entrada</span>
              </button>
              <button onclick="setNatureza('sangria')" class="py-2 rounded-xl text-xs font-black uppercase flex items-center justify-center gap-1.5 transition-all ${selectedNatureza === 'sangria' ? 'bg-red-500 text-white shadow-md' : 'text-zinc-400 hover:text-red-400'}">
                <i data-lucide="arrow-up-right" class="w-3.5 h-3.5 stroke-[2.5]"></i>
                <span>- Sangria</span>
              </button>
            </div>

            <!-- Categorias em Pílulas -->
            <div class="flex items-center gap-1.5 overflow-x-auto pb-0.5">
              ${[
                { id: 'dinheiro', label: 'Dinheiro', icon: 'banknote' },
                { id: 'entrada_prestacao', label: 'Prestação', icon: 'arrow-down-circle' },
                { id: 'multiplo', label: 'Misto', icon: 'split' },
                { id: 'compra_vista', label: 'À Vista', icon: 'shopping-cart' }
              ].map(c => `
                <button onclick="setCat('${c.id}')" class="px-3 py-1.5 rounded-xl text-[10.5px] font-black uppercase flex items-center gap-1.5 border transition-all flex-shrink-0 ${selectedCat === c.id ? 'bg-zinc-100 border-zinc-100 text-zinc-950' : 'bg-zinc-900 border-zinc-800 text-zinc-400 hover:text-white'}">
                  <i data-lucide="${c.icon}" class="w-3 h-3"></i>
                  <span>${c.label}</span>
                </button>
              `).join('')}
            </div>

            <!-- Display de Valor Hero com Botão Troco -->
            <div class="bg-[#09090c] p-3 px-4 rounded-2xl border border-zinc-800 flex items-center justify-between">
              <div class="flex-1">
                <div class="text-[9.5px] font-bold uppercase text-zinc-500">Valor a Lançar</div>
                <div class="flex items-baseline font-black mono text-2xl ${selectedNatureza === 'entrada' ? 'text-emerald-400' : 'text-red-400'}">
                  <span class="text-xs mr-1 font-bold ${selectedNatureza === 'entrada' ? 'text-emerald-500' : 'text-red-500'}">${selectedNatureza === 'entrada' ? '+' : '-'}</span>
                  <span class="text-zinc-500 text-sm font-bold mr-0.5">R$</span>
                  <span>${currentValor}</span>
                </div>
              </div>
              <button onclick="toggleCalc()" class="h-9 px-3 rounded-xl border flex items-center gap-1.5 text-xs font-bold transition-all ${isCalcOpen ? 'bg-purple-500/20 border-purple-500/40 text-purple-300' : 'bg-zinc-900 border-zinc-800 text-zinc-400 hover:text-purple-300'}">
                <i data-lucide="calculator" class="w-3.5 h-3.5"></i>
                <span class="text-[10px] uppercase font-black">Troco</span>
              </button>
            </div>

            <!-- Botões Rápidos de Incremento (+5, +10, +20, +50, Zerar) -->
            <div class="grid grid-cols-5 gap-1.5">
              <button onclick="addValor(5)" class="py-1.5 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-300 text-xs font-black mono hover:border-zinc-700 active:scale-95 transition-all">+ 5</button>
              <button onclick="addValor(10)" class="py-1.5 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-300 text-xs font-black mono hover:border-zinc-700 active:scale-95 transition-all">+ 10</button>
              <button onclick="addValor(20)" class="py-1.5 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-300 text-xs font-black mono hover:border-zinc-700 active:scale-95 transition-all">+ 20</button>
              <button onclick="addValor(50)" class="py-1.5 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-300 text-xs font-black mono hover:border-zinc-700 active:scale-95 transition-all">+ 50</button>
              <button onclick="currentValor='0,00'; render();" class="py-1.5 rounded-xl bg-zinc-900/50 border border-zinc-800 text-zinc-500 text-[10px] font-black uppercase hover:text-red-400 active:scale-95 transition-all">Zerar</button>
            </div>

            <!-- Calculadora de Troco Inteligente -->
            ${isCalcOpen ? `
              <div class="bg-[#14121a] p-3 rounded-2xl border border-purple-500/30 grid grid-cols-2 gap-2">
                <div>
                  <div class="text-[9px] font-bold text-purple-300 uppercase">Recebido Cliente</div>
                  <input type="text" placeholder="R$ 0,00" class="bg-[#09090c] border border-purple-500/20 rounded-xl px-3 py-2 text-white mono font-black text-sm w-full mt-1" />
                </div>
                <div>
                  <div class="text-[9px] font-bold text-purple-300 uppercase">Troco Devolvido</div>
                  <input type="text" placeholder="R$ 0,00" class="bg-[#09090c] border border-purple-500/20 rounded-xl px-3 py-2 text-white mono font-black text-sm w-full mt-1" />
                </div>
              </div>
            ` : ''}

            <!-- Descrição & Contrato em Linha Simétrica -->
            <div class="grid grid-cols-5 gap-2">
              <div class="col-span-3">
                <input type="text" placeholder="Descrição (ex: Venda Balcão)" class="w-full bg-[#09090c] border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white font-medium focus:outline-none focus:border-zinc-700" />
              </div>
              <div class="col-span-2">
                <input type="text" placeholder="Nº Contrato" class="w-full bg-[#09090c] border border-zinc-800 rounded-xl px-3 py-2 text-xs text-center text-zinc-300 font-bold focus:outline-none focus:border-zinc-700 uppercase" />
              </div>
            </div>

            <!-- Botão de Salvar Imponente -->
            <button onclick="alert('Lançamento Registrado com Sucesso!')" class="w-full py-3 rounded-2xl ${selectedNatureza === 'entrada' ? 'bg-emerald-500 hover:bg-emerald-400 text-zinc-950 shadow-emerald-500/20' : 'bg-red-500 hover:bg-red-400 text-white shadow-red-500/20'} font-black text-xs uppercase tracking-wider flex items-center justify-center gap-2 shadow-lg active:scale-[0.98] transition-all">
              <i data-lucide="check" class="w-4 h-4 stroke-[3]"></i>
              <span>${selectedNatureza === 'entrada' ? 'Registrar Entrada' : 'Registrar Sangria'}</span>
            </button>

          </div>

          <!-- 3. BARRA DE BUSCA COMPACTA COM FILTROS -->
          <div class="flex items-center gap-2">
            <div class="flex-1 bg-[#121216] border border-zinc-800/80 rounded-xl px-3 py-2 flex items-center gap-2">
              <i data-lucide="search" class="w-3.5 h-3.5 text-zinc-500"></i>
              <input type="text" placeholder="Buscar por valor, contrato..." class="bg-transparent text-xs text-white focus:outline-none w-full font-medium" />
            </div>
            <span class="px-2.5 py-2 rounded-xl bg-[#121216] border border-zinc-800 text-[10px] font-black uppercase text-zinc-400">
              22 Itens
            </span>
          </div>

          <!-- 4. FEED DE TRANSAÇÕES COM PROPORÇÕES 36PX -->
          <div class="space-y-2">
            
            <!-- Card 1 -->
            <div class="bg-[#121216] border border-zinc-800/80 hover:border-zinc-700 rounded-2xl p-3 flex items-center justify-between shadow-sm transition-all">
              <div class="flex items-center gap-3 min-w-0">
                <div class="h-9 w-9 rounded-xl bg-emerald-500/15 border border-emerald-500/30 flex items-center justify-center text-emerald-400 flex-shrink-0">
                  <i data-lucide="banknote" class="w-4.5 h-4.5"></i>
                </div>
                <div class="min-w-0">
                  <div class="flex items-center gap-1.5">
                    <span class="text-[10px] font-black uppercase text-emerald-400 tracking-wider">Dinheiro</span>
                    <span class="text-[9px] text-zinc-500 font-bold">• 14:32:05</span>
                    <span class="text-[8px] font-black bg-zinc-800 text-zinc-400 px-1.5 py-0.2 rounded border border-zinc-700">#40921</span>
                  </div>
                  <div class="text-xs font-bold text-white truncate mt-0.5">Venda Balcão Balas</div>
                </div>
              </div>
              <div class="text-right flex-shrink-0">
                <div class="mono font-black text-emerald-400 text-base leading-tight">+R$ 150,00</div>
                <div class="flex items-center justify-end gap-1.5 mt-0.5">
                  <button class="p-1 text-zinc-500 hover:text-zinc-300"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i></button>
                  <button class="p-1 text-zinc-500 hover:text-red-400"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                </div>
              </div>
            </div>

            <!-- Card 2 -->
            <div class="bg-[#121216] border border-zinc-800/80 hover:border-zinc-700 rounded-2xl p-3 flex items-center justify-between shadow-sm transition-all">
              <div class="flex items-center gap-3 min-w-0">
                <div class="h-9 w-9 rounded-xl bg-blue-500/15 border border-blue-500/30 flex items-center justify-center text-blue-400 flex-shrink-0">
                  <i data-lucide="arrow-down-circle" class="w-4.5 h-4.5"></i>
                </div>
                <div class="min-w-0">
                  <div class="flex items-center gap-1.5">
                    <span class="text-[10px] font-black uppercase text-blue-400 tracking-wider">Prestação</span>
                    <span class="text-[9px] text-zinc-500 font-bold">• 13:15:22</span>
                    <span class="text-[8px] font-black bg-emerald-500/15 text-emerald-400 px-1.5 py-0.2 rounded border border-emerald-500/30">+ R$ 0,05</span>
                  </div>
                  <div class="text-xs font-bold text-white truncate mt-0.5">Renegociação João Silva</div>
                </div>
              </div>
              <div class="text-right flex-shrink-0">
                <div class="mono font-black text-blue-300 text-base leading-tight">+R$ 280,00</div>
                <div class="flex items-center justify-end gap-1.5 mt-0.5">
                  <button class="p-1 text-zinc-500 hover:text-zinc-300"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i></button>
                  <button class="p-1 text-zinc-500 hover:text-red-400"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                </div>
              </div>
            </div>

            <!-- Card 3 -->
            <div class="bg-[#121216] border border-red-500/20 hover:border-red-500/40 rounded-2xl p-3 flex items-center justify-between shadow-sm transition-all">
              <div class="flex items-center gap-3 min-w-0">
                <div class="h-9 w-9 rounded-xl bg-red-500/15 border border-red-500/30 flex items-center justify-center text-red-400 flex-shrink-0">
                  <i data-lucide="arrow-up-right" class="w-4.5 h-4.5"></i>
                </div>
                <div class="min-w-0">
                  <div class="flex items-center gap-1.5">
                    <span class="text-[10px] font-black uppercase text-red-400 tracking-wider">Sangria</span>
                    <span class="text-[9px] text-zinc-500 font-bold">• 11:40:00</span>
                  </div>
                  <div class="text-xs font-bold text-white truncate mt-0.5">Retirada Cofre Central</div>
                </div>
              </div>
              <div class="text-right flex-shrink-0">
                <div class="mono font-black text-red-400 text-base leading-tight">-R$ 500,00</div>
                <div class="flex items-center justify-end gap-1.5 mt-0.5">
                  <button class="p-1 text-zinc-500 hover:text-zinc-300"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i></button>
                  <button class="p-1 text-zinc-500 hover:text-red-400"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                </div>
              </div>
            </div>

          </div>
        `;
      } else if (currentConcept === 2) {
        // =========================================================================
        // CONCEITO 2: CYBER-FINTECH STUDIO (DOCK DUPLO + TIMELINE AGRUPADA)
        // =========================================================================
        tag.innerText = 'Conceito 2: Cyber Studio';
        tag.className = 'px-2.5 py-1 rounded-xl bg-blue-500/10 border border-blue-500/20 text-blue-400 text-xs font-black uppercase';
        
        desc.innerHTML = `
          <div class="font-black text-white uppercase text-sm mb-1">⚡ Conceito 2 — Cyber-Fintech Studio:</div>
          <div><b>• Dock Superior Simétrico:</b> Entradas e Sangrias lado a lado, exatamente como o Dock de Saídas & Canhotos do Painel.</div>
          <div><b>• Formulário em 1 Card Titânio:</b> Totalmente integrado sem caixas aninhadas, com display em fundo preto puro.</div>
          <div><b>• Timeline Agrupada:</b> O histórico divide os lançamentos por turnos (ex: <i>Tarde (12h - 18h)</i> vs <i>Manhã</i>).</div>
        `;

        body.innerHTML = `
          <!-- DOCK DUPLO SIMÉTRICO -->
          <div class="bg-[#121216] border border-zinc-800/80 rounded-2xl p-3 px-4 flex items-center shadow-lg min-h-[68px]">
            <div class="flex-1">
              <div class="text-[10.5px] font-bold text-emerald-400 uppercase">Entradas Espécie</div>
              <div class="mono text-lg font-black text-white">+R$ 1.051,00</div>
            </div>
            <div class="w-px h-8 bg-zinc-800 mx-2"></div>
            <div class="flex-1">
              <div class="text-[10.5px] font-bold text-red-400 uppercase">Sangrias Retiradas</div>
              <div class="mono text-lg font-black text-white">-R$ 0,00</div>

          </div>

          <!-- FORMULÁRIO STUDIO -->
          <div class="bg-[#121216] border border-zinc-800/80 rounded-[28px] p-4 shadow-xl space-y-3">

            <div class="bg-[#09090c] p-3 px-4 rounded-2xl border border-zinc-800">

              <div class="mono text-2xl font-black text-white mt-0.5">
                <span class="text-zinc-500 text-sm font-bold">R$</span> ${currentValor}

            </div>

            <div class="grid grid-cols-2 gap-2">
              <input type="text" placeholder="Descrição" class="bg-[#09090c] border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white" />
              <input type="text" placeholder="Contrato" class="bg-[#09090c] border border-zinc-800 rounded-xl px-3 py-2 text-xs text-center text-zinc-300 font-bold uppercase" />
            </div>

            <button onclick="alert('Lançamento Registrado!')" class="w-full py-3 rounded-2xl bg-zinc-100 hover:bg-white text-zinc-950 font-black text-xs uppercase tracking-wider shadow-lg">
              Confirmar Lançamento
            </button>
          </div>

          <!-- TIMELINE SEPARADA -->
          <div class="pt-2">
            <div class="text-[10px] font-black uppercase tracking-wider text-zinc-500 mb-2 ml-1">Tarde • 14:00 às 18:00</div>
            <div class="space-y-2">
              <div class="bg-[#121216] border border-zinc-800/80 rounded-2xl p-3 flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <div class="h-9 w-9 rounded-xl bg-emerald-500/15 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
                    <i data-lucide="banknote" class="w-4.5 h-4.5"></i>
                  </div>
                  <div>
                    <div class="text-[10px] font-black uppercase text-emerald-400">Dinheiro • 14:32</div>
                    <div class="text-xs font-bold text-white">Venda Balcão Balas</div>
                  </div>
                </div>
                <div class="mono font-black text-emerald-400 text-base">+R$ 150,00</div>
              </div>
            </div>
          </div>
        `;
      } else if (currentConcept === 3) {
        // =========================================================================
        // CONCEITO 3: TIMELINE AUDIT & BOTTOM-SHEET (FOCO TOTAL NA LISTA + BOTÃO HERO)
        // =========================================================================
        tag.innerText = 'Conceito 3: Timeline & Sheet';
        tag.className = 'px-2.5 py-1 rounded-xl bg-purple-500/10 border border-purple-500/20 text-purple-300 text-xs font-black uppercase';
        
        desc.innerHTML = `
          <div class="font-black text-white uppercase text-sm mb-1">🌌 Conceito 3 — Timeline Audit & Bottom-Sheet:</div>
          <div><b>• Foco 100% na Consulta:</b> A tela principal mostra todos os lançamentos em cartões refinados sem ocupar espaço com formulário estático.</div>
          <div><b>• Botão Hero Flutuante:</b> Um botão <code>+ Novo Lançamento</code> no topo ou na base abre uma gaveta rápida ultra-veloz.</div>
        `;

        body.innerHTML = `
          <!-- HERO RESUMO -->
          <div class="bg-[#121216] border border-zinc-800/80 rounded-[28px] p-4 flex items-center justify-between shadow-xl">
            <div>
              <div class="text-[10px] font-bold text-zinc-400 uppercase">Dinheiro na Gaveta</div>
              <div class="mono text-2xl font-black text-emerald-400">R$ 1.051,00</div>
            </div>
            <button onclick="alert('Abrindo Gaveta de Novo Lançamento!')" class="h-10 px-4 rounded-xl bg-emerald-500 text-zinc-950 font-black text-xs uppercase flex items-center gap-1.5 shadow-lg shadow-emerald-500/20 active:scale-95 transition-all">
              <i data-lucide="plus" class="w-4 h-4 stroke-[3]"></i>
              <span>Lançar</span>
            </button>
          </div>

          <!-- LISTA PURA DE LANÇAMENTOS -->
          <div class="space-y-2 pt-1">
            ${[
              { id: '1', tipo: 'Dinheiro', valor: '+R$ 150,00', hora: '14:32:05', desc: 'Venda Balcão Balas', contrato: '#40921', color: 'emerald' },
              { id: '2', tipo: 'Prestação', valor: '+R$ 280,00', hora: '13:15:22', desc: 'Renegociação João Silva', sobra: '+ R$ 0,05', color: 'blue' },
              { id: '3', tipo: 'Sangria', valor: '-R$ 500,00', hora: '11:40:00', desc: 'Retirada Cofre Central', color: 'red' },
              { id: '4', tipo: 'Dinheiro', valor: '+R$ 90,00', hora: '10:12:44', desc: 'Troco Inicial Entregue', color: 'emerald' },
              { id: '5', tipo: 'Dinheiro', valor: '+R$ 1.031,00', hora: '09:00:10', desc: 'Abertura de Caixa Espécie', color: 'emerald' },
            ].map(item => `
              <div class="bg-[#121216] border border-zinc-800/80 hover:border-zinc-700 rounded-2xl p-3 flex items-center justify-between shadow-sm">
                <div class="flex items-center gap-3 min-w-0">
                  <div class="h-9 w-9 rounded-xl bg-${item.color}-500/15 border border-${item.color}-500/30 flex items-center justify-center text-${item.color}-400 flex-shrink-0">
                    <i data-lucide="${item.color === 'red' ? 'arrow-up-right' : 'banknote'}" class="w-4.5 h-4.5"></i>
                  </div>
                  <div class="min-w-0">
                    <div class="flex items-center gap-1.5">
                      <span class="text-[10px] font-black uppercase text-${item.color}-400 tracking-wider">${item.tipo}</span>
                      <span class="text-[9px] text-zinc-500 font-bold">• ${item.hora}</span>
                      ${item.contrato ? `<span class="text-[8px] font-black bg-zinc-800 text-zinc-400 px-1.5 py-0.2 rounded border border-zinc-700">${item.contrato}</span>` : ''}
                      ${item.sobra ? `<span class="text-[8px] font-black bg-emerald-500/15 text-emerald-400 px-1.5 py-0.2 rounded border border-emerald-500/30">${item.sobra}</span>` : ''}
                    </div>
                    <div class="text-xs font-bold text-white truncate mt-0.5">${item.desc}</div>
                  </div>
                </div>
                <div class="mono font-black text-${item.color}-400 text-base flex-shrink-0">${item.valor}</div>
              </div>
            `).join('')}
          </div>
        `;
      }

      lucide.createIcons();
    }

    render();
  </script>
